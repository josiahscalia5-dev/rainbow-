name: Recover original Rainbow assets
on:
  push:
    branches:
      - chatgpt/rainbow-s06-continuity-20261120
    paths:
      - .github/workflows/recover-rainbow-assets.yml
permissions:
  contents: read
concurrency:
  group: rainbow-exact-assets-7543647
  cancel-in-progress: false
jobs:
  bundle:
    if: github.repository == 'josiahscalia5-dev/rainbow-' && github.ref == 'refs/heads/chatgpt/rainbow-s06-continuity-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out only the original asset paths
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          ref: 7543647ae9ea8b86589e3684013969336dd2d848
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /assets/textures/match06/plate06_hybrid.png
            /assets/textures/match08/plate08_clean.png
            /assets/textures/match08/plate08_hybrid.png
            /assets/textures/tunnel05/wall05.png
            /assets/textures/water05/proj05_E.png
            /assets/textures/water05/proj05_T2.png
            /assets/textures/match06/tile_hole06.png
            /assets/textures/match06/tile_hole06b.png
            /assets/models/benny.glb
            /assets/models/lids05.glb
            /assets/models/rainbow_girl.glb
      - name: Restore only the three original LFS models
        shell: bash
        run: git lfs pull --include="assets/models/benny.glb,assets/models/lids05.glb,assets/models/rainbow_girl.glb" --exclude=""
      - name: Verify original bytes and prepare the exact asset bundle
        shell: bash
        run: |
          python3 - <<'PY_VERIFY'
          import hashlib, json, pathlib, subprocess
          source = "7543647ae9ea8b86589e3684013969336dd2d848"
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != source:
              raise SystemExit("Pinned checkout does not match")
          expected = [{'path': 'assets/textures/match06/plate06_hybrid.png', 'bytes': 2597147, 'git_blob_sha': '16114fb59f5cc0914dca937f1ea3dbb6cc49d87b', 'kind': 'png'}, {'path': 'assets/textures/match08/plate08_clean.png', 'bytes': 6591567, 'git_blob_sha': '3ca417e0e8795c004b8e9e85d9c3b0749ae6471e', 'kind': 'png'}, {'path': 'assets/textures/match08/plate08_hybrid.png', 'bytes': 6078171, 'git_blob_sha': '94466024b768ca4c52c9d693ca638b894d7682d4', 'kind': 'png'}, {'path': 'assets/textures/tunnel05/wall05.png', 'bytes': 1633057, 'git_blob_sha': 'b05f3fe7f5a9d3628e383a367799551b709f0477', 'kind': 'png'}, {'path': 'assets/textures/water05/proj05_E.png', 'bytes': 2029538, 'git_blob_sha': '7f09a737bb28033ac7451b6e0f4dac58bc99234f', 'kind': 'png'}, {'path': 'assets/textures/water05/proj05_T2.png', 'bytes': 1502225, 'git_blob_sha': 'aaf4aeb8735be522693bf3ce3bde74ae4493067c', 'kind': 'png'}, {'path': 'assets/textures/match06/tile_hole06.png', 'bytes': 1271412, 'git_blob_sha': 'd6b117fc5be2a14e996932f4bb98934d27394a09', 'kind': 'png'}, {'path': 'assets/textures/match06/tile_hole06b.png', 'bytes': 1360127, 'git_blob_sha': 'a4a4e9b90e74d3e251cae343f2d97afaf09f7ea1', 'kind': 'png'}, {'path': 'assets/models/benny.glb', 'bytes': 1126892, 'lfs_sha256': '40633fdd02014c6434bb61811c03bc0c61a8d456c30fbb9cd62bb9a91a0198a1', 'kind': 'glb'}, {'path': 'assets/models/lids05.glb', 'bytes': 992168, 'lfs_sha256': 'f2cd3abeaaf219635321c1f2ffead20eb91403d73ff7ef3173380a0ecedbb22c', 'kind': 'glb'}, {'path': 'assets/models/rainbow_girl.glb', 'bytes': 3546480, 'lfs_sha256': 'fa846773af9a593d090ec2c0ac4ea69812306fc334439b05f900bc9311f92528', 'kind': 'glb'}]
          bundle = pathlib.Path("restore-artifact")
          bundle.mkdir(exist_ok=False)
          manifest = {"source_commit": source, "files": []}
          for item in expected:
              path = pathlib.Path(item["path"])
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("Missing or invalid asset: " + item["path"])
              data = path.read_bytes()
              if len(data) != item["bytes"]:
                  raise SystemExit("Size mismatch: " + item["path"])
              digest = hashlib.sha256(data).hexdigest()
              if item["kind"] == "png":
                  blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
                  if blob != item["git_blob_sha"] or not data.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise SystemExit("Git image verification failed: " + item["path"])
              elif digest != item["lfs_sha256"] or data[:4] != b"glTF":
                  raise SystemExit("Original LFS model verification failed: " + item["path"])
              output = bundle / path
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(data)
              manifest["files"].append({**item, "sha256": digest})
          (bundle / "RESTORE_ASSET_MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print("Verified and bundled exactly", len(manifest["files"]), "original assets.")
          PY_VERIFY
      - name: Save the private recovery artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rainbow-exact-assets-7543647
          path: restore-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
          archive: true
