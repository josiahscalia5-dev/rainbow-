name: Check World Labs API access (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/rainbow-s06-continuity-20261120
    paths:
      - .github/workflows/check-worldlabs-access.yml

permissions:
  contents: read

concurrency:
  group: worldlabs-access-readonly-candidate
  cancel-in-progress: false

jobs:
  credits:
    if: github.repository == 'josiahscalia5-dev/rainbow-' && github.ref == 'refs/heads/chatgpt/rainbow-s06-continuity-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out this exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7; matches existing recovery workflow
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/chatgpt/worldlabs_s06.py
      - name: Read API credits without generation or spending
        shell: bash
        env:
          WLT_API_KEY: ${{ secrets.WLT_API_KEY }}
        run: python3 tools/chatgpt/worldlabs_s06.py credits
