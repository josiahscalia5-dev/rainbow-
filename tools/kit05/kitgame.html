<script type="module">
// Round 33 KIT TEST (experimental, not the game): a real 3D tunnel kit fitted to the approved Screen 05 painting

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') ?? 412), H = +(q.get('h') ?? 915);

const camQ0 = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(), V3(K.cam_fwd), V3(K.cam_up)));

vec3 kitRemap(vec3 wp){ vec3 d = wp - uCam; float za = dot(d, uAx); float gz = za <= uZ2 ? za : uZ2 * exp((za - uZ2) / uZ2); return wp + (gz - za) * uAx; }`;
const kitMat = (map, extra = {}, own = null) => {   // own = { tex, vr: [v0, v1] }: this section's OWN painted pixels (atlas rows)
  const m = new THREE.MeshBasicMaterial({ map, toneMapped: false, side: THREE.DoubleSide, ...extra });
  m.customProgramCacheKey = () => (own ? 'kit-own' : 'kit');   // three.js keys programs on the onBeforeCompile source: identical for both variants
  const OU = own ? { uOwn: { value: own.tex }, uVr: { value: new THREE.Vector2(...own.vr) }, uFade: { value: new THREE.Vector2(...K.own.fade) } } : {};

const tex1 = () => { const t = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); t.needsUpdate = true; return t; };

      .replace('diffuseColor *= texture(map, vMapUv, uBias);', `

        float kT = vKitT, kZ = max(vKitD, 1e-3);                     // world axial position, axial distance ahead of the camera
        float kU = kLat - kCenter(kT);                               // river-local lateral (0 = river centre)

        vec4 kRib;

          kRib = mix(rB, rA, 1.0 - abs(1.0 - 2.0 * rPh));
          float dW = kRib.a * uR35D.w * (1.0 - smoothstep(uR35DS.z, uR35DS.w, kZ)) * smoothstep(0.35, 1.3, kZ);   // row softness x distance window (no straight bars right under the camera)
          if (dW > 0.001) {
            vec2 dUV = vec2((kLat - kCenter(kT) + uR35D.y + uHWD) / (2.0 * uHWD), (kT + uFlow * uR35D.z) / uR35D.x);
            float det = texture(uR35Det, dUV).r - 0.5; det *= det > 0.0 ? uR35DS.x : uR35DS.y;
            det *= smoothstep(0.0, 0.06, dUV.x) * smoothstep(1.0, 0.94, dUV.x);   // no mirrored streak copies (W marks) at the strip's edges

            kRib.rgb = det > 0.0 ? mix(kRib.rgb, vec3(1.0), clamp(det * dW, 0.0, 1.0)) : kRib.rgb * (1.0 + det * dW);
          }

          // walls take the painting's magenta (channel map cyan (35,170,244) -> (244,35,227); white streaks stay white-pink, foam stays foam)
          { float pkW = uR35P.x * smoothstep(uR35P.y, uR35P.z, abs(kLat));

const NSEC = +(q.get('nsec') ?? 30), KMIN = -1;
