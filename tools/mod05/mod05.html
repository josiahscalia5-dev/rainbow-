// Switches: ?gray=1 geometry test (plain grey materials) · ?sentinel=1 holes show pure green · ?play=1 real-time phone play

const DEG = Math.PI / 180, UPV = new THREE.Vector3(0, 1, 0);
const sstep = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
const rngOf = (seed) => { let x = seed >>> 0; return () => ((x = (Math.imul(x, 1103515245) + 12345) & 0x7fffffff) / 0x7fffffff); };

{ const z0 = BZ0 + 1.2, z1 = Z_END + 1.0; let acc = 0, next = 0, px = centreX(z0), pz = z0;

const AHEAD = LAY.benny.ahead, LEVEL = Math.min(RLEN - 2, LAY.level.length);

const frameAt = (s) => { at(Math.min(RLEN, s + 0.06), _a); at(Math.max(0, s - 0.06), _b); const t = _a.clone().sub(_b).normalize();
  const r = new THREE.Vector3().crossVectors(t, UPV).normalize(), n = new THREE.Vector3().crossVectors(r, t).normalize(); return { t, r, n }; };

// gives the metal its finish (gold rings + paddles reflect it; the walls get a soft sheen); no punctual lights
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 96, 48), new THREE.ShaderMaterial({ side: THREE.BackSide,
  vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `varying vec3 vD; void main(){ vec3 d = normalize(vD); float a = atan(d.y, d.x);
    vec3 wall = mix(vec3(0.30, 0.04, 0.62), vec3(0.85, 0.10, 0.55), 0.5 + 0.5 * sin(a * 3.0 + 0.6));
    float bands = pow(0.5 + 0.5 * cos(d.z * 22.0), 10.0) * (1.0 - 0.6 * abs(d.z));
    float strips = pow(0.5 + 0.5 * cos(a * 8.0), 30.0) * 0.8;

// ---------------- repeating textures ----------------
const tl = new THREE.TextureLoader();

const [wallTex, ringTex] = await Promise.all([tex('wall_tile.png', 16, 2), tex('ring_tile.png', 12, 1)]);

// ---------------- materials (one per kind, shared by every clone) ----------------
const grayM = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, metalness: 0.0 });
const wallMat = GRAY ? grayM(0x8c8c8c) : new THREE.MeshStandardMaterial({ map: wallTex, emissiveMap: wallTex, emissive: 0xffffff, emissiveIntensity: +(q.get('wallglow') ?? 0.62),
  metalness: 0.55, roughness: 0.3, envMapIntensity: 0.55, side: THREE.BackSide });
const ringMat = GRAY ? grayM(0xb0b0b0) : new THREE.MeshStandardMaterial({ map: ringTex, emissiveMap: ringTex, emissive: 0xffffff, emissiveIntensity: +(q.get('ringglow') ?? 0.42),
  metalness: 1.0, roughness: 0.22, envMapIntensity: 1.0 });
const goldMat = GRAY ? grayM(0xa8a8a8) : new THREE.MeshStandardMaterial({ color: sRGB([251, 150, 70]), emissive: sRGB([200, 80, 14]), emissiveIntensity: +(q.get('padglow') ?? 0.55),
  metalness: 1.0, roughness: 0.2, envMapIntensity: 1.1 });

// ---------------- MODULE: wall piece + gold ring + two paddles (built once, cloned along the drum) ----------------
// wall piece: open cylinder, one ring spacing long, front at z = 0, back at z = -SP; UV u around (seam under the water), v along
const wallGeo = new THREE.CylinderGeometry(R, R, SP, 192, 1, true); wallGeo.rotateX(Math.PI / 2); wallGeo.translate(0, 0, -SP / 2);
// gold ring: lathe profile (front face, three raised bands with two grooves on the inner surface, back face); custom v across the profile
const ringGeo = (() => { const B = LAY.ring.band, DP = LAY.ring.depth, pts = [], vs = [];
  pts.push(new THREE.Vector2(R + 0.03, 0)); vs.push(0.0);
  for (let i = 0; i <= 4; i++) { const a = i / 4 * Math.PI / 2; pts.push(new THREE.Vector2(R - DP + 0.02 - 0.02 * Math.sin(a) + 0.0, 0.02 * (1 - Math.cos(a)))); vs.push(0.02 + 0.03 * i / 4); }
  for (let i = 1; i < 36; i++) { const y = 0.02 + (B - 0.04) * i / 36, f = (y - 0.02) / (B - 0.04), g = Math.abs(Math.sin(f * 3 * Math.PI));
    pts.push(new THREE.Vector2(R - DP + 0.022 * (1 - g ** 0.6), y)); vs.push(0.05 + 0.9 * f); }
  for (let i = 0; i <= 4; i++) { const a = i / 4 * Math.PI / 2; pts.push(new THREE.Vector2(R - DP + 0.02 * (1 - Math.cos(a)), B - 0.02 + 0.02 * Math.sin(a))); vs.push(0.95 + 0.03 * i / 4); }
  pts.push(new THREE.Vector2(R + 0.03, B)); vs.push(1.0);

  for (let i = 0; i < uv.count; i++) uv.setY(i, vs[i % pts.length]);
  g.rotateX(-Math.PI / 2); return g; })();

const PD = LAY.paddle;
const paddleGeo = (() => { const s = new THREE.Shape(); s.moveTo(-PD.length / 2, 0); s.lineTo(PD.length / 2, 0); s.absellipse(0, 0, PD.length / 2, PD.reach, 0, Math.PI, false);
  const g = new THREE.ExtrudeGeometry(s, { depth: PD.thick, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 4, curveSegments: 40 });

  const tilt = PD.tilt_deg * DEG * (Math.cos(th) > 0 ? -1 : 1);             // both sides lean their face toward the drum centre / the camera
  const p = nIn.clone().multiplyScalar(Math.cos(tilt)).addScaledVector(tg, Math.sin(tilt)).normalize(), a = new THREE.Vector3(0, 0, -1), c = new THREE.Vector3().crossVectors(a, p).normalize();
  m.matrix.makeBasis(a, p, c).setPosition(AX + R * Math.cos(th) - 0.03 * nIn.x, AY + R * Math.sin(th) - 0.03 * nIn.y, zc); m.matrixAutoUpdate = false; };
const module0 = new THREE.Group();
module0.add(Object.assign(new THREE.Mesh(wallGeo, wallMat), { name: 'wall' }), Object.assign(new THREE.Mesh(ringGeo, ringMat), { name: 'ring' }),
  Object.assign(new THREE.Mesh(paddleGeo, goldMat), { name: 'paddleL' }), Object.assign(new THREE.Mesh(paddleGeo, goldMat), { name: 'paddleR' }));
for (let k = -3; k < NSEC; k++) {
  const m = module0.clone(), z0 = ringZ(k);
  m.children[0].position.set(AX, AY, z0); m.children[1].position.set(AX, AY, z0);
  const kk = ((k % 2) + 2) % 2;
  placePaddle(m.children[2], PD.left_deg[kk], z0 - PD.at * SP); placePaddle(m.children[3], PD.right_deg[kk], z0 - PD.at * SP);
  if (k < 0) { m.children[2].visible = m.children[3].visible = false; }   // no paddles behind the camera's start
  addW(m, 'module_' + k, 'module');
}
// the bright far end: an end wall + a soft glow (the painting's warm core at the end of the tunnel)
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  for (const [o, col] of [[0, 'rgba(255,255,248,1)'], [0.14, 'rgba(255,250,215,1)'], [0.32, 'rgba(255,226,160,0.75)'], [0.6, 'rgba(255,190,170,0.25)'], [1, 'rgba(255,170,200,0)']]) gr.addColorStop(o, col);

{ const cap = new THREE.Mesh(new THREE.CircleGeometry(R + 0.05, 96), new THREE.MeshBasicMaterial({ color: sRGB(LAY.glow.color), fog: false })); cap.position.set(AX, AY, Z_END); addW(cap, 'far_end', 'end');
  const gl = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, fog: false, transparent: true, depthWrite: false })); gl.scale.setScalar(R * 4.2); gl.position.set(AX, AY * 0.6, Z_END + 0.6); gl.renderOrder = 3; addW(gl, 'far_glow', 'end'); }

// ---------------- ONE continuous water material over the whole floor ----------------
// river space: d = distance down the drum from Benny's painted point, kU = distance across from the S centre line (the same function as the
// route). Inside |kU| < RW: the river (cyan silk ribbons + magenta side bands + streaks + sparkles, round-37/38 option-B design ported);
// beyond the banks: the same water continuing as calmer magenta / violet pool water up to the walls (the 3D foam clusters sit on the banks)
const WATER_U = { uT: { value: 0 }, uR1: { value: new THREE.Vector4(AX, BX0, BZ0, RT.amp * RT.first_swing) }, uR2: { value: new THREE.Vector4(RT.wavelength, RT.ease_in, RT.centre_ease, RW) },

    varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;

  fragmentShader: `#include <fog_pars_fragment>
    uniform float uT; uniform vec4 uR1; uniform vec4 uR2; uniform float uFlow; uniform float uCamZ; varying vec3 vW;
    float ez(float x){ x = clamp(x, 0.0, 1.0); return x * x * (3.0 - 2.0 * x); }
    float cX(float z){ float d = uR1.z - z; return uR1.y + (uR1.x - uR1.y) * ez(d / uR2.z) + uR1.w * ez(d / uR2.y) * sin(6.2831853 * d / uR2.x); }

    float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(h2(i), h2(i + vec2(1.0, 0.0)), f.x), mix(h2(i + vec2(0.0, 1.0)), h2(i + vec2(1.0, 1.0)), f.x), f.y); }
    void main(){
      float RW = uR2.w, kT = uR1.z - vW.z, kZ = max(uCamZ - vW.z, 1e-3);
      float c = cX(vW.z), cs = (cX(vW.z - 0.05) - cX(vW.z + 0.05)) * 10.0;
      float kU = (vW.x - c) / sqrt(1.0 + cs * cs), u = kU / RW, au = abs(u);
      float tp = kT + uT * uFlow;
      float bend = clamp((cX(vW.z - 0.3) - cX(vW.z + 0.3)) * 2.0, -1.0, 1.0);
      // silk ribbons along the flow: deep blue edge -> bright cyan crest + thin highlight, then a crisp step to the next ribbon

      float mea = 0.55 * sin(tp * 0.83 + uu * 2.3) + 0.35 * sin(tp * 1.71 - uu * 3.1 + 1.3) + 0.7 * (n2(vec2(uu * 1.6, tp * 0.45)) - 0.5);
      float w = uu * 9.0 * 0.5 + mea;
      float f = fract(w), fw = max(fwidth(w), 1e-4), lod = 1.0 - smoothstep(0.15, 0.5, fw), dropW = max(0.06, 1.5 * fw);
      float sh = 0.2 + 0.5 * pow(smoothstep(0.0, 0.92, f), 2.2) - 0.3 * (1.0 - smoothstep(0.0, max(0.14, 2.0 * fw), f)) * smoothstep(0.0, 0.5 * dropW, f) - 0.36 * smoothstep(1.0 - dropW, 1.0, f);

      float crest = exp(-pow((f - 0.86) / max(0.045, fw * 1.2), 2.0)) * lod * smoothstep(0.15, 0.6, n2(vec2(floor(w) * 7.13, tp * 1.4)));
      float near = 1.0 - smoothstep(0.9, 2.6, kZ);                                  // broad arcs across the flow close to the camera
      sh = clamp(sh + 0.26 * near * sin(6.2832 * (tp * 1.15 + 0.45 * u * u)), 0.0, 1.0);
      { float X = kU * 95.0 + 2.0 * n2(vec2(kU * 9.0, tp * 1.1)); float fl = 1.0 - smoothstep(0.25, 0.6, fwidth(X)); sh = clamp(sh + 0.12 * fl * sin(X), 0.0, 1.0); }
      vec3 bD = c8(4.0, 100.0, 228.0), bM = c8(10.0, 150.0, 248.0), bB = c8(90.0, 225.0, 255.0);
      vec3 pD = c8(164.0, 43.0, 212.0), pM = c8(251.0, 34.0, 217.0), pB = c8(252.0, 134.0, 251.0);

      vec3 pink = sh < 0.55 ? mix(pD, pM, sh / 0.55) : mix(pM, pB, (sh - 0.55) / 0.45);

      float pin = 0.52 + 0.06 * sin(tp * 0.71 + sign(u) * 1.7) - 0.08 * bend * sign(u) + 0.04 * (n2(vec2(tp * 0.9, sign(u) * 5.0)) - 0.5);
      float pkE = max(0.03, 1.5 * fwidth(u)), pk = smoothstep(pin - pkE, pin + pkE, au);
      float pool = smoothstep(1.05, 1.6, au);
      vec3 col = mix(blue, pink, pk);
      col = mix(col, mix(pink, mix(blue, c8(150.0, 70.0, 230.0), 0.5), 0.35 + 0.25 * sin(tp * 0.6 + u)), pool * 0.6);
      col = mix(col, mix(vec3(0.85, 0.97, 1.0), vec3(1.0, 0.8, 0.97), pk), crest * 0.7);
      // white highlight streaks riding the current, three scales; far ones fade to a gentle brightening

  splash.position.copy(benny.position).addScaledVector(F.t, 0.09).addScaledVector(F.n, -CT.c.h + splash.scale.y * 0.3);
  CT.water(F, v, dt);
  camAt(dt); WATER_U.uCamZ.value = camera.position.z;
  updateEnd(st.s);
  for (const c of coins) { if (c.got < 0 && CT.hits(c)) { c.got = t; coinCount += 10; coinEl.textContent = '\u{1FA99} ' + coinCount.toLocaleString('en-US'); }
    if (c.got >= 0 && c.s < 1e8) { const k = (t - c.got) / 0.4; c.sp.visible = k < 1; if (k < 1) { c.sp.position.copy(benny.position).addScaledVector(F.n, bennyH * (1.05 + 0.6 * k)); c.sp.scale.setScalar(coinD * 0.7 * (1 - 0.5 * k)); } } }
  coins.forEach((c, i) => { const m = coin3[i]; m.visible = c.sp.visible && c.s < 1e8; if (!m.visible) return; m.position.copy(c.sp.position);
    m.scale.setScalar(c.got >= 0 ? c.sp.scale.x : coinD); m.quaternion.setFromAxisAngle(F.n, 0.5 * Math.sin(t * 1.9 + i * 1.3)); });
  return { s: +st.s.toFixed(3), lat: +st.lat.toFixed(3), coins: coinCount, socks: 0, z: +benny.position.z.toFixed(3), guard: st.guard, ...CT.state() };
};
window.renderNow = async (n = 1) => { for (let i = 0; i < n; i++) renderer.render(scene, camera); return true; };
window.camInfo = () => ({ p: camera.position.toArray().map((x) => +x.toFixed(4)), q: camera.quaternion.toArray().map((x) => +x.toFixed(5)), fov: camera.fov });
window.bennyInfo = () => { const p = benny.position.clone().project(camera); return { x: +((p.x + 1) / 2 * W).toFixed(1), y: +((1 - p.y) / 2 * H).toFixed(1) }; };
window.bennyBox = () => { benny.updateMatrixWorld(true); const a = bmesh.geometry.attributes.position, v = new THREE.Vector3(); let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < a.count; i += 3) { v.fromBufferAttribute(a, i).applyMatrix4(bmesh.matrixWorld).project(camera); const x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return { x0: +x0.toFixed(1), x1: +x1.toFixed(1), y0: +y0.toFixed(1), y1: +y1.toFixed(1) }; };
window.sceneAudit = () => { scene.updateMatrixWorld(true); return MESH.map((o) => ({ name: o.name || o.parent?.name, m: o.matrixWorld.elements.map((x) => +x.toFixed(5)) })); };
window.sectionInfo = () => ({ LEVEL: +LEVEL.toFixed(3), S_REF: +S_REF.toFixed(3), meshes: MESH.length, coins: LAYC.length, foam: FOAM.length, modules: NSEC + 3, screen: '05-mod',
  tris: renderer.info.render.triangles, calls: renderer.info.render.calls });
window.qaGoto = (s) => { st.s = s; window.step(st.t, 0, 0, 0); return st.s; };
window.qaRoute = () => ({ RLEN: +RLEN.toFixed(3), S_REF, LEVEL, Z_END, maxOff: +Math.max(...RP.map((p) => Math.abs(p.x - AX))).toFixed(3), chord: +CHORD.toFixed(3) });
window.state = () => ({ s: st.s });
window.step(0, 0, 0, 0);
document.getElementById('load').style.display = 'none';
renderer.render(scene, camera);
window.ready = true;
if (q.get('play')) {   // real-time play (phone): tap to swim, swipes steer
  let t0 = null, last = 0; const tapEl = document.createElement('div'); tapEl.textContent = 'Tap to swim'; tapEl.style.cssText = 'position:fixed;left:0;right:0;bottom:22%;text-align:center;color:#fff;font-weight:800;font-size:26px;text-shadow:0 2px 6px #000a;z-index:9';
  document.body.appendChild(tapEl); let go = false; addEventListener('pointerdown', () => { go = true; tapEl.remove(); }, { once: true });
  const loop = (now) => { requestAnimationFrame(loop); if (!go) { renderer.render(scene, camera); return; } if (t0 === null) { t0 = now; last = now; } const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (window.paused) { t0 += now - last; last = now; renderer.render(scene, camera); return; }
    if (st.s < LEVEL) window.step((now - t0) / 1000, dt, 0, +q.get('speed')); renderer.render(scene, camera); };
  requestAnimationFrame(loop);
}
