  for (const [k, id] of [['blast', 'blast'], ['turbo', 'turbo']]) { const a = AB[k], p = t < a.ready ? Math.min(1, (a.ready - t) / (a.dur + a.cd)) : 0; document.querySelector('#' + id + ' .cd').style.setProperty('--p', (p * 100).toFixed(1) + '%'); }
  for (const c of coins) { if (c.got < 0 && CT.hits(c)) { c.got = t; coinCount += 10; coinEl.textContent = '\u{1FA99} ' + coinCount.toLocaleString('en-US'); }
    if (c.got >= 0 && c.s < 1e8) { const k = (t - c.got) / 0.4; c.sp.visible = k < 1; if (k < 1) { c.sp.position.copy(benny.position).addScaledVector(F.n, bennyH * (1.05 + 0.6 * k)); c.sp.scale.setScalar(coinD * 0.7 * (1 - 0.5 * k)); } } }
  coins.forEach((c, i) => { const m = coin3[i]; m.visible = c.sp.visible && c.s < 1e8; if (!m.visible) return; m.position.copy(c.sp.position);
    m.scale.setScalar(c.got >= 0 ? c.sp.scale.x : coinD); m.quaternion.setFromAxisAngle(UPV, 0.5 * Math.sin(t * 1.9 + i * 1.3)); });
  for (const sk of SOCKS) { if (!sk.visible) continue; sk.geometry.computeBoundingSphere(); const c = sk.geometry.boundingSphere.center.clone().add(sk.position);
    if (Math.abs(c.z - benny.position.z) < 0.25 && Math.abs(c.x - benny.position.x) < 0.3) { sk.visible = false; socksGot = Math.min(5, socksGot + 1); drawSlots(); gems += 5; gemEl.textContent = gems; } }
  if (q.get('return') === '1' && st.s >= LEVEL - 0.05 && !st.left) { st.left = true; setTimeout(() => { location.href = '../index.html?resume=05&bonus=1&coins=' + coinCount; }, 250); }
  const inT = camera.position.z < T.z_arch - 0.3; titleEl.style.display = inT ? 'none' : ''; badgeEl.style.display = inT ? 'none' : ''; missionEl.style.display = inT ? 'block' : 'none';
  for (const id of ['blast', 'turbo']) document.getElementById(id).style.display = inT ? '' : 'none';   // each part shows its own picture's HUD
  return { s: +st.s.toFixed(3), lat: +st.lat.toFixed(3), coins: coinCount, socks: socksGot, gems, turbo: +turboK.toFixed(2), blast: t < AB.blast.until, z: +benny.position.z.toFixed(3), ...CT.state() };
};
// QA diagnostics (round 41): ?dbg=nowater hides every water surface, ?dbg=nosplash hides the splash sprite and all swim effects around Benny
{ const dbg = q.get('dbg') ?? '';
  if (dbg.includes('nowater')) for (const m of WSEG) m.visible = false;
  if (dbg.includes('nosplash')) { const keep = new Set(coins.map((c) => c.sp)); scene.traverse((o) => { if ((o.isSprite || (o.renderOrder >= 5 && o.renderOrder <= 7 && o !== benny && !o.name.startsWith('coin3d') && o.name !== 'bubbles')) && !keep.has(o)) o.userData.dbgHide = true; });
    const hideFx = () => scene.traverse((o) => { if (o.userData.dbgHide) o.visible = false; }); hideFx(); const s0 = window.step; window.step = (...a) => { const r = s0(...a); hideFx(); return r; }; } }
window.renderNow = async (n = 1) => { for (let i = 0; i < n; i++) renderer.render(scene, camera); return true; };
window.camInfo = () => ({ p: camera.position.toArray().map((x) => +x.toFixed(4)), q: camera.quaternion.toArray().map((x) => +x.toFixed(5)), fov: camera.fov });
window.bennyInfo = () => { const p = benny.position.clone().project(camera); return { x: +((p.x + 1) / 2 * W).toFixed(1), y: +((1 - p.y) / 2 * H).toFixed(1) }; };
window.bennyBox = () => { benny.updateMatrixWorld(true); const a = bmesh.geometry.attributes.position, v = new THREE.Vector3(); let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < a.count; i += 3) { v.fromBufferAttribute(a, i).applyMatrix4(bmesh.matrixWorld).project(camera); const x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return { x0: +x0.toFixed(1), x1: +x1.toFixed(1), y0: +y0.toFixed(1), y1: +y1.toFixed(1) }; };
window.sceneAudit = () => { scene.updateMatrixWorld(true); const out = []; world.traverse((o) => { if (o.isMesh) out.push({ name: o.name, m: o.matrixWorld.elements.map((x) => +x.toFixed(5)) }); }); return out; };
window.sectionInfo = () => ({ LEVEL: +LEVEL.toFixed(3), S_SOCK: +S_SOCK.toFixed(3), z_arch: T.z_arch, z_exit: Z_EXIT, meshes: MESH.length, foam: FOAM.length, coins: LAY.length, bake: BAKE_STATS });
window.state = window.state ?? (() => ({ s: st.s }));
window.step(0, 0, 0, 0);
document.getElementById('load').style.display = 'none';
renderer.render(scene, camera);
window.ready = true;
if (q.get('play')) {   // real-time play (phone): tap to swim, swipes steer
  let t0 = null, last = 0; const tapEl = document.createElement('div'); tapEl.textContent = 'Tap to swim'; tapEl.style.cssText = 'position:fixed;left:0;right:0;bottom:22%;text-align:center;color:#fff;font-weight:800;font-size:26px;text-shadow:0 2px 6px #000a';
  document.body.appendChild(tapEl); let go = false; addEventListener('pointerdown', () => { go = true; tapEl.remove(); }, { once: true });
  const loop = (now) => { requestAnimationFrame(loop); if (!go) { renderer.render(scene, camera); return; } if (t0 === null) { t0 = now; last = now; } const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (window.paused) { t0 += now - last; last = now; renderer.render(scene, camera); return; }
    if (st.s < LEVEL) window.step((now - t0) / 1000, dt, 0, +q.get('speed')); renderer.render(scene, camera); };
  requestAnimationFrame(loop);
}
